[project]
name = "portable-ffmpeg"
version = "0.5.0"
description = "Downloads static ffmpeg builds for Windows, macOS, and Linux"
readme = "README.md"
authors = [
    { name = "Marko Bausch", email = "60338487+mrkbac@users.noreply.github.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "ffmpeg",
    "ffprobe",
    "video",
    "audio",
    "multimedia",
    "static",
    "portable",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/mrkbac/portable-ffmpeg"
Repository = "https://github.com/mrkbac/portable-ffmpeg"
Issues = "https://github.com/mrkbac/portable-ffmpeg/issues"

[project.optional-dependencies]
dev = ["pytest>=9.1.0", "pytest-cov", "ruff", "pyright", "pre-commit"]

[project.scripts]
static_ffmpeg = "portable_ffmpeg:run_ffmpeg"
static_ffprobe = "portable_ffmpeg:run_ffprobe"
print_paths = "portable_ffmpeg:print_paths"
clear_cache = "portable_ffmpeg:clear_cache"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ['ALL']
ignore = [
    "S310",    # Audit URL open (expected for downloading binaries)
    "S103",    # os.chmod setting permissive mask (need executable permissions)
    "S603",    # subprocess call: check for execution of untrusted input (expected for CLI entry points)
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "PLR2004", # Magic values (acceptable in some cases)
    "T201",    # print statement used
    "ERA001",  # Commented-out code
    "CPY001",  # No copyright headers in this project
]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# relaxes in tests
"tests/*" = [
    "S101",    # Use of assert detected (legitimate in tests)
    "BLE001",  # Broad exception catching (acceptable in tests)
    "PT011",   # Broad pytest.raises (sometimes acceptable)
    "PERF203", # try-except in loop (acceptable in tests)
    "PLR2004", # Magic values (acceptable in tests)
    "D401",    # Imperative mood (less important in tests)
    "PLC0415", # Lazy imports are fine in tests
    "PYI034",  # `Self` return type needs 3.11+
]

[dependency-groups]
dev = [{ include-group = "test" }, "pre-commit>=4.7.0", "ruff>=0.17.2", "ty>=0.0.91"]
# Kept separate so CI can test on Pythons that pre-commit's deps have no wheels for yet.
test = ["pytest>=9.1.0", "pytest-cov>=7.1.0", "pytest-mock>=3.17.0"]

[tool.ty.environment]
# Lowest supported version: ty must not use or allow features newer than this.
python-version = "3.11"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
# Everything ty ships off by default, turned on.
blanket-ignore-comment = "error"
disjoint-cast = "error"
division-by-zero = "error"
dynamic-function-decorator-return = "error"
invalid-legacy-positional-parameter = "error"
mismatched-sentinel-name = "error"
missing-direct-dependency = "error"
missing-override-decorator = "ignore" # needs @override: py3.12+ or typing_extensions
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-condition-strict = "error"
truthiness-test-of-none-union = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
addopts = "--strict-markers --strict-config"

[tool.coverage.report]
fail_under = 100
show_missing = true
