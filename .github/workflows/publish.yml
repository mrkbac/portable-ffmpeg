name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev --group test

      - name: Run tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(uv run python -c 'from portable_ffmpeg.config import _RELEASE_BASE; print(_RELEASE_BASE.rsplit("/", 1)[1])')
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.xz' --pattern manifest.json --dir dist/binaries
          uv run pytest --release-dir dist/binaries

      - name: Build package
        run: |
          uv build --out-dir dist/python
          uv run -m scripts.build_full_wheels dist/binaries dist/python

      - name: Publish to PyPI
        run: uv publish dist/python/*
