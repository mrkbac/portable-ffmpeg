name: Lint and Test

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tox-dev/action-pre-commit-uv@v1

  test:
    needs: pre-commit
    permissions:
      contents: read

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # x86
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          # arm64
          - ubuntu-24.04-arm
          - macos-latest
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev --group test -p "${{ matrix.python-version }}"

      - name: Download the pinned platform archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python - <<'PY'
          import subprocess
          from portable_ffmpeg.config import DOWNLOAD_URLS
          from portable_ffmpeg.enums import Architectures, OperatingSystems
          config = DOWNLOAD_URLS[OperatingSystems.from_current_system()][Architectures.from_current_architecture()]
          base, tag, filename = config.url.rsplit("/", 2)
          repository = "/".join(base.split("/")[3:5])
          subprocess.run(["gh", "release", "download", tag, "--repo", repository, "--pattern", filename, "--dir", "dist/binaries"], check=True)
          PY

      - name: Run tests
        run: |
          uv run run_test.py --release-dir dist/binaries
